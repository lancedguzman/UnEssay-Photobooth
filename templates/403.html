{% extends 'photobooth/base.html' %}
{% load static %}

{% block content %}
<div style="text-align: center; max-width: 600px; margin: 0 auto;">
    <h1 class="vintage-title" style="font-size: 5rem; color: #d32f2f;">Access Denied</h1>
    
    <div style="background: #222; color: #fff; padding: 20px; border: 4px solid #d32f2f; display: inline-block; margin: 20px 0; transform: rotate(-2deg);">
        <h3 style="font-family: 'Courier New', monospace; text-transform: uppercase; letter-spacing: 2px; margin: 0;">
            Do Not Enter
        </h3>
    </div>

    <p style="font-size: 1.3rem; margin: 30px 0;">
        You don't have the key to this darkroom.
    </p>

    <a href="{% url 'photobooth:landing' %}" class="btn-vintage">
        Go Back Home
    </a>
</div>
{% endblock %}
