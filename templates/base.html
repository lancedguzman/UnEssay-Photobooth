<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Vintage Photobooth</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Sacramento&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-cream: #F7F4EF;
            --text-brown: #5D4037; 
            --btn-coffee: #6F4E37;
            --btn-hover: #563b2a;
            --white: #ffffff;
        }

        /* Global Reset for better sizing */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-cream);
            font-family: 'Cormorant Garamond', serif;
            color: var(--text-brown);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Navigation --- */
        nav {
            display: flex;
            justify-content: flex-end;
            padding: 20px 40px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-brown);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .icon {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* --- Main Layout --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            width: 100%;
        }

        /* --- Typography & Buttons --- */
        .vintage-title {
            font-family: 'Sacramento', cursive;
            font-size: 5rem;
            color: #8B5A2B;
            margin: 20px 0;
            font-weight: 400;
            line-height: 1.1;
            word-wrap: break-word; /* Prevents long text breaking layout */
        }

        .btn-container {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap; /* Allows wrapping on small screens */
            justify-content: center;
            width: 100%;
        }

        .btn-vintage {
            background-color: var(--btn-coffee);
            color: var(--white);
            border: none;
            padding: 15px 40px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(93, 64, 55, 0.2);
            white-space: nowrap;
        }

        .btn-vintage:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
        }

        footer {
            padding: 30px;
            text-align: center;
            font-size: 1.1rem;
        }

        .footer-link {
            color: var(--text-brown);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-bottom 0.2s;
        }

        .footer-link:hover {
            border-bottom: 1px solid var(--text-brown);
        }

        .polaroid-stack {
            max-width: 250px;
            width: 80%; /* Responsive width */
            margin-bottom: 20px;
            transform: rotate(-5deg);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 8px solid #fff;
            background: #fff;
        }

        /* --- MOBILE RESPONSIVENESS (iPhone/iPad) --- */
        @media (max-width: 768px) {
            .vintage-title {
                font-size: 3.5rem; /* Smaller title on mobile */
            }
            
            nav {
                justify-content: center; /* Center nav on mobile */
                padding: 15px 20px;
            }

            .btn-container {
                flex-direction: column; /* Stack buttons vertically */
                align-items: center;
                gap: 15px;
            }

            .btn-vintage {
                width: 100%; /* Full width buttons on mobile */
                max-width: 280px; /* But don't get too wide */
                text-align: center;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="nav-link">
            <svg class="icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            About
        </a>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <a href="https://lancedguzman05.pythonanywhere.com/" class="footer-link">→ Developed by Lance De Guzman</a>
    </footer>

</body>
</html>
