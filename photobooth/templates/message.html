{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto; text-align: center;">
    
    <h1 class="vintage-title" style="font-size: 3.5rem;">Add a Note</h1>

    <div style="background: #fff; padding: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); transform: rotate(2deg); width: 200px; margin: 0 auto 30px auto; border: 1px solid #eee;">
        <img src="{{ session.final_file.url }}" style="width: 100%; display: block;">
    </div>

    <form method="POST">
        {% csrf_token %}
        
        <div style="margin-bottom: 20px; text-align: left;">
            <label style="font-family: 'Special Elite', cursive; font-size: 1.2rem; color: var(--text-brown); display: block; margin-bottom: 5px;">
                Who are you?
            </label>
            <textarea name="message_iam" placeholder="I am..." rows="2" maxlength="75"
                    style="width: 100%; padding: 15px; font-family: 'Special Elite', cursive; font-size: 1.3rem; 
                            border: 2px solid var(--btn-coffee); background: #fff8f0; color: #444; border-radius: 8px; outline: none; resize: none;"></textarea>
        </div>

        <div style="margin-bottom: 30px; text-align: left;">
            <label style="font-family: 'Special Elite', cursive; font-size: 1.2rem; color: var(--text-brown); display: block; margin-bottom: 5px;">
                What do you leave behind?
            </label>
            <textarea name="message_reject" placeholder="I reject..." rows="2" maxlength="75"
                    style="width: 100%; padding: 15px; font-family: 'Special Elite', cursive; font-size: 1.3rem; 
                            border: 2px solid var(--btn-coffee); background: #fff8f0; color: #444; border-radius: 8px; outline: none; resize: none;"></textarea>
        </div>
        
        <button type="submit" class="btn-vintage" style="padding: 15px 40px; font-size: 1.5rem;">
            Print Strip
        </button>
    </form>
    
    <div style="margin-top: 20px;">
        <a href="{% url 'photobooth:result' session.id %}" style="color: #888; text-decoration: none; border-bottom: 1px dotted #888;">Skip this step</a>
    </div>
</div>
{% endblock %}
