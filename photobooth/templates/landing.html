{% extends 'base.html' %}
{% load static %} 

{% block content %}
    <style>
        .modal-overlay {
            display: none; 
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(93, 64, 55, 0.85); /* Vintage brown overlay */
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background-color: var(--bg-cream); /* Reusing base.html variables */
            padding: 30px;
            border-radius: 12px;
            max-width: 850px;
            width: 90%;
            text-align: center;
            position: relative;
        }

        .strip-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 20px 0;
        }

        .strip-option {
            cursor: pointer;
            transition: transform 0.2s;
            border: 4px solid transparent;
            padding: 5px;
            background: white;
        }

        .strip-option:hover {
            transform: scale(1.05);
            border-color: var(--btn-coffee);
        }

        .strip-option img {
            width: 100%;
            height: auto;
        }

        .strip-name {
            display: block;
            margin-top: 8px;
            font-weight: 600;
        }
    </style>

    <h1 class="vintage-title">What We Reject Photobooth</h1>

    <div class="btn-container">
        <a href="{% url 'photo_ui' %}?template=photostrip.jpg" class="btn-vintage">
            Use Camera
        </a>
        <a href="{% url 'gif_ui' %}" class="btn-vintage">
            Capture GIF
        </a>
    </div>
{% endblock %}
