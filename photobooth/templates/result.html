{% extends 'base.html' %} 

{% block content %}
    <h1 class="vintage-title">Your Keepsake</h1>

    <div style="background: #fff; padding: 20px 20px 60px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); transform: rotate(-1deg); margin-bottom: 50px; max-width: 90%; border: 1px solid #e0e0e0;">
        
        <img src="{{ session.final_file.url }}" alt="Photobooth Result" style="max-width: 100%; height: auto; display: block; border: 1px solid #eee;">
        
    </div>

    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; width: 100%; max-width: 900px; margin-bottom: 40px;">
        
        <div style="flex: 1; min-width: 250px; text-align: center;">
            <h3 style="font-family: 'Montserrat', sans-serif; font-size: 1.4rem; color: var(--text-brown); border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 20px;">
                Keep It
            </h3>
            <p style="font-size: 0.9rem; margin-bottom: 20px;">Save to your device.</p>
            <a href="{{ session.final_file.url }}" download class="btn-vintage">
                Download Photo
            </a>
        </div>

        <div style="flex: 1; min-width: 250px; text-align: center;">
            <h3 style="font-family: 'Montserrat', sans-serif; font-size: 1.4rem; color: var(--text-brown); border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 20px;">
                Scan It
            </h3>
            <div style="background: white; padding: 15px; display: inline-block; border: 4px solid var(--text-brown); border-radius: 4px;">
                <img src="{{ qr_code }}" alt="Scan QR" style="width: 140px; height: 140px; display: block;">
            </div>
            <p style="font-size: 0.9rem; margin-top: 10px;">Scan to open on mobile</p>
        </div>

        <div style="flex: 1; min-width: 250px; text-align: center;">
            <h3 style="font-family: 'Montserrat', sans-serif; font-size: 1.4rem; color: var(--text-brown); border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 20px;">
                Share It
            </h3>
            <p style="font-size: 0.9rem; margin-bottom: 15px;">Copy the unique link below.</p>
            
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                <input type="text" value="{{ share_url }}" id="share-link" readonly 
                       style="padding: 10px; border: 2px solid var(--btn-coffee); background: transparent; 
                              font-family: 'Montserrat', sans-serif; font-size: 1rem; width: 150px; color: var(--text-brown); border-radius: 4px;">
                
                <button onclick="copyLink()" class="btn-vintage" style="padding: 10px 20px; font-size: 1rem;">
                    Copy
                </button>
            </div>
            <div id="copy-msg" style="height: 20px; margin-top: 10px; color: green; font-size: 0.9rem; font-weight: bold;"></div>
        </div>
    </div>

    <div style="margin-top: 20px; border-top: 1px solid #ccc; padding-top: 20px; width: 50%;">
        <a href="{% url 'photobooth:landing' %}" class="footer-link" style="font-size: 1.2rem;">
            ← Start a New Session
        </a>
    </div>

    <script>
        function copyLink() {
            const copyText = document.getElementById("share-link");
            copyText.select();
            copyText.setSelectionRange(0, 99999); // For mobile devices
            navigator.clipboard.writeText(copyText.value);
            
            const msg = document.getElementById("copy-msg");
            msg.innerText = "Copied to clipboard!";
            setTimeout(() => msg.innerText = "", 3000);
        }
    </script>
{% endblock %}
